<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Drift Simülatörü 3D</title>
<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#110e14;overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #c{display:block;width:100vw;height:100vh;}
  
  /* UI Layout overlay */
  #ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
  
  /* Steering and Pedals Controls on mobile */
  #controls{position:fixed;bottom:24px;left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px;pointer-events:none;}
  .ctrl-group{display:flex;gap:16px;pointer-events:all;}
  
  /* Steering Round Buttons */
  .steer-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(18, 12, 28, 0.75);
    border: 3px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.15);
    transition: all 0.12s cubic-bezier(0.1, 0.8, 0.3, 1);
  }
  .steer-btn:active {
    background: rgba(255, 61, 0, 0.45);
    border-color: #ff3d00;
    transform: scale(0.9);
    box-shadow: 0 0 20px rgba(255, 61, 0, 0.6);
  }

  /* Sleek Metal Pedals */
  .pedal-container {
    display: flex;
    align-items: flex-end;
    gap: 20px;
  }
  .pedal {
    position: relative;
    border-radius: 14px;
    background: linear-gradient(135deg, #374151 0%, #111827 100%);
    border: 3.5px solid #4b5563;
    box-shadow: 
      0 12px 28px rgba(0,0,0,0.6), 
      inset 0 4px 6px rgba(255,255,255,0.2),
      inset 0 -6px 12px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  /* Accelerator (Gas) - Tall & Sporty */
  .pedal-gas {
    width: 64px;
    height: 130px;
    border-color: #10b981;
  }
  .pedal-gas::before {
    content: '';
    position: absolute;
    top: 15%; left: 15%; right: 15%; bottom: 15%;
    border-radius: 6px;
    background: repeating-linear-gradient(0deg, #111827, #111827 8px, #6b7280 8px, #6b7280 14px);
    border-top: 2px solid rgba(255,255,255,0.15);
  }
  .pedal-gas:active {
    transform: scaleY(0.9) scaleX(0.95) translateY(6px);
    border-color: #34d399;
    box-shadow: 0 0 25px rgba(52,211,153,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
  }

  /* Brake - Wider & Grippy */
  .pedal-brake {
    width: 88px;
    height: 105px;
    border-color: #ef4444;
  }
  .pedal-brake::before {
    content: '';
    position: absolute;
    top: 15%; left: 10%; right: 10%; bottom: 15%;
    border-radius: 6px;
    background: repeating-linear-gradient(90deg, #111827, #111827 8px, #6b7280 8px, #6b7280 16px);
    border-top: 2px solid rgba(255,255,255,0.15);
  }
  .pedal-brake:active {
    transform: scaleY(0.9) scaleX(0.95) translateY(6px);
    border-color: #f87171;
    box-shadow: 0 0 25px rgba(248,113,113,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%);
  }

  .pedal-label {
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    font-family: monospace;
    z-index: 2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .pedal-gas:active .pedal-label { color: #34d399; text-shadow: 0 0 8px rgba(52,211,153,0.7); }
  .pedal-brake:active .pedal-label { color: #f87171; text-shadow: 0 0 8px rgba(248,113,113,0.7); }

  /* HUD Design */
  #hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;pointer-events:none;}
  .hud-box{background:rgba(20, 10, 30, 0.75);border:2px solid rgba(255, 107, 74, 0.3);border-radius:14px;padding:8px 18px;color:#fff;font-family:monospace;backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,0.6);display:flex;align-items:baseline;gap:4px;}
  .hud-val{font-size:26px;font-weight:900;color:#ff6b4a;text-shadow:0 0 12px rgba(255,107,74,0.5);}
  .hud-unit{font-size:10px;color:rgba(255,255,255,0.6);text-transform:uppercase;font-weight:bold;}

  /* Active Drift Score UI */
  #drift-toast {
    position: fixed;
    top: 96px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-family: monospace;
    text-align: center;
    z-index: 5;
  }
  #drift-toast.active {
    opacity: 1;
    transform: translateX(-50%) scale(1.1);
  }
  .drift-title {
    color: #ffca28;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 0 0 15px rgba(255, 202, 40, 0.8), 0 2px 4px rgba(0,0,0,0.5);
    letter-spacing: 3px;
    animation: driftPulse 0.4s infinite alternate;
  }
  .drift-score {
    color: #00e676;
    font-size: 19px;
    font-weight: bold;
    text-shadow: 0 0 12px rgba(0, 230, 118, 0.8);
    margin-top: 2px;
  }
  
  @keyframes driftPulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  /* Rounded Back Button */
  #back-btn{
    position:fixed;
    top:16px;
    left:16px;
    background:rgba(24, 15, 36, 0.85);
    border:2.5px solid rgba(255, 255, 255, 0.35);
    border-radius:50%;
    width:50px;
    height:50px;
    color:#fff;
    font-size:22px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    pointer-events:all;
    z-index:100;
    backdrop-filter:blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition:all 0.2s cubic-bezier(0.1, 0.8, 0.3, 1);
  }
  #back-btn:active{
    background:rgba(239, 68, 68, 0.35);
    border-color:#ef4444;
    transform:scale(0.85);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
  }
  
  /* Top Right Status Label */
  #car-label{
    position:fixed;
    top:16px;
    right:16px;
    background:rgba(24, 15, 36, 0.85);
    border:2px solid rgba(255,107,74,0.4);
    border-radius:14px;
    padding:8px 16px;
    color:#ff6b4a;
    font-size:12px;
    font-weight:bold;
    font-family:monospace;
    pointer-events:none;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
  }

  /* Sound / Audio Hint label overlay */
  #sound-hint {
    position: fixed;
    bottom: 165px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: rgba(255,255,255,0.8);
    font-family: monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 10px;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.15);
    text-align: center;
    z-index: 100;
  }

  /* Fallback loading view */
  #loader {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: #110e14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 999;
    font-family: monospace;
    transition: opacity 0.5s ease;
  }
  .spinner {
    border: 4px solid rgba(255, 255, 255, 0.1);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border-left-color: #ff6b4a;
    animation: spin 1s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div id="load-text">YÜKLENİYOR...</div>
</div>

<canvas id="c"></canvas>

<div id="ui">
  <button id="back-btn" onclick="exitDrivingGame()">✕</button>
  <div id="car-label">🚗 MOD: YÜKLENİYOR...</div>
  
  <div id="hud">
    <div class="hud-box">🚗 <span class="hud-val" id="spd">0</span><span class="hud-unit">km/h</span></div>
    <div class="hud-box">🌆 <span class="hud-val" id="dist">0</span><span class="hud-unit">m</span></div>
  </div>

  <div id="drift-toast">
    <div class="drift-title" id="drift-title">DRIFTING!</div>
    <div class="drift-score" id="drift-score">+0 PTS</div>
  </div>

  <div id="sound-hint">🔊 GERÇEKÇİ MOTOR SESİ İÇİN PEDALLARA BASIN</div>

  <div id="controls">
    <!-- Directional Buttons (Left) -->
    <div class="ctrl-group">
      <div class="steer-btn" id="btn-left">◀</div>
      <div class="steer-btn" id="btn-right">▶</div>
    </div>
    
    <!-- Real-life styled metallic Pedals (Right) -->
    <div class="ctrl-group">
      <div class="pedal-container">
        <!-- Brake -->
        <div class="pedal pedal-brake" id="btn-brake">
          <span class="pedal-label">FREN</span>
        </div>
        <!-- Gas -->
        <div class="pedal pedal-gas" id="btn-gas">
          <span class="pedal-label">GAZ</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Expose exit driving game bridge function
function exitDrivingGame() {
  if (window.Android && typeof window.Android.exitGame === 'function') {
    window.Android.exitGame();
  } else {
    history.back();
  }
}

// ── WEB AUDIO API ENGINE & DRIFT SCREECH SYNTHESIZER ───────────────────────────
class RealCarSynth {
  constructor() {
    this.ctx = null;
    this.initialized = false;
    
    // Engine nodes
    this.osc1 = null;
    this.osc2 = null;
    this.oscSub = null;
    this.filter = null;
    this.gain = null;
    
    // Tire screech nodes
    this.screechOsc = null;
    this.screechMod = null;
    this.screechGain = null;
    this.screechFilter = null;
  }
  
  init() {
    if (this.initialized) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
      
      const now = this.ctx.currentTime;
      
      // 1. ENGINE RUMBLE ASSEMBLY
      this.osc1 = this.ctx.createOscillator();
      this.osc2 = this.ctx.createOscillator();
      this.oscSub = this.ctx.createOscillator();
      this.filter = this.ctx.createBiquadFilter();
      this.gain = this.ctx.createGain();
      
      this.osc1.type = 'sawtooth';
      this.osc1.frequency.setValueAtTime(45, now);
      
      this.osc2.type = 'triangle';
      this.osc2.frequency.setValueAtTime(90, now);
      
      this.oscSub.type = 'sawtooth'; // Deep rumbling V8 exhaust
      this.oscSub.frequency.setValueAtTime(22, now);
      
      this.filter.type = 'lowpass';
      this.filter.frequency.setValueAtTime(160, now);
      this.filter.Q.setValueAtTime(4, now);
      
      this.gain.gain.setValueAtTime(0.01, now); // soft idle
      
      this.osc1.connect(this.filter);
      this.osc2.connect(this.filter);
      this.oscSub.connect(this.filter);
      this.filter.connect(this.gain);
      this.gain.connect(this.ctx.destination);
      
      this.osc1.start(0);
      this.osc2.start(0);
      this.oscSub.start(0);
      
      // 2. TIRE SCREECH (DRIFT/BRAKE) SYNTHESIZER
      this.screechOsc = this.ctx.createOscillator();
      this.screechMod = this.ctx.createOscillator();
      this.screechModGain = this.ctx.createGain();
      this.screechFilter = this.ctx.createBiquadFilter();
      this.screechGain = this.ctx.createGain();
      
      this.screechOsc.type = 'sawtooth';
      this.screechOsc.frequency.setValueAtTime(850, now);
      
      this.screechMod.type = 'sine';
      this.screechMod.frequency.setValueAtTime(65, now); // fast wobble vibration
      this.screechModGain.gain.setValueAtTime(140, now); // freq deviation
      
      this.screechFilter.type = 'bandpass';
      this.screechFilter.frequency.setValueAtTime(1100, now);
      this.screechFilter.Q.setValueAtTime(2.5, now);
      
      this.screechGain.gain.setValueAtTime(0, now); // start quiet
      
      // Frequency Modulation connection
      this.screechMod.connect(this.screechModGain);
      this.screechModGain.connect(this.screechOsc.frequency);
      
      this.screechOsc.connect(this.screechFilter);
      this.screechFilter.connect(this.screechGain);
      this.screechGain.connect(this.ctx.destination);
      
      this.screechOsc.start(0);
      this.screechMod.start(0);
      
      this.initialized = true;
      
      // Hide sound instructions when initialized
      const hint = document.getElementById('sound-hint');
      if (hint) hint.style.display = 'none';
    } catch(e) {
      console.warn("Web Audio init error: ", e);
    }
  }
  
  update(speedRatio, isThrottle, isBraking, isDrifting) {
    if (!this.initialized) return;
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    
    const now = this.ctx.currentTime;
    
    // Rev ranges
    const throttleFactor = isThrottle ? 0.4 : 0.0;
    const currentRPM = Math.max(0.12, Math.min(1.0, speedRatio + throttleFactor));
    
    // Update main cylinder base frequencies
    const f1 = 40 + (currentRPM * 150);
    const f2 = 80 + (currentRPM * 300);
    const fSub = 20 + (currentRPM * 75);
    
    this.osc1.frequency.setTargetAtTime(f1, now, 0.05);
    this.osc2.frequency.setTargetAtTime(f2, now, 0.05);
    this.oscSub.frequency.setTargetAtTime(fSub, now, 0.08);
    
    // Lowpass filter opens up at high RPMs for louder exhaust growl
    const targetCutoff = 130 + (currentRPM * 450);
    this.filter.frequency.setTargetAtTime(targetCutoff, now, 0.08);
    
    // Set engine gain
    let engineVol = 0.15 + (currentRPM * 0.2);
    if (isThrottle) engineVol += 0.12; // load gain
    this.gain.gain.setTargetAtTime(engineVol, now, 0.04);
    
    // Screech Sound effect trigger
    if (isDrifting || (isBraking && speedRatio > 0.25)) {
      const vol = isDrifting ? 0.15 : 0.1;
      // High frequency pitch slide on screeches
      const pitchSlide = 750 + Math.sin(now * 30) * 100 + (speedRatio * 200);
      this.screechOsc.frequency.setValueAtTime(pitchSlide, now);
      this.screechGain.gain.setTargetAtTime(vol, now, 0.04);
    } else {
      this.screechGain.gain.setTargetAtTime(0.0, now, 0.12);
    }
  }
}

const carSound = new RealCarSynth();

// Initialize sound on user interactions
function triggerSoundActivation() {
  carSound.init();
}
window.addEventListener('touchstart', triggerSoundActivation, { once: true });
window.addEventListener('mousedown', triggerSoundActivation, { once: true });
window.addEventListener('keydown', triggerSoundActivation, { once: true });


// ── PARSE STATE METADATA ───────────────────────────────────────────────────────
const hashStr = decodeURIComponent(location.hash.slice(1));
const hash = hashStr.split(',');
const carId = hash[0] || 'car_standard';
const carColorHex = parseInt(hash[1] || '0xd50000'); // Default to glowing Red!
const carName = (hash[2] || 'Kırmızı Spor Araba').replace(/_/g, ' ');
const lang = hash[3] || 'TR';

document.getElementById('car-label').textContent = (lang === 'TR' ? '🏎️ GARAJ MODU: ' : '🏎️ DRIVE MODE: ') + carName.toUpperCase();
document.getElementById('load-text').textContent = (lang === 'TR' ? 'SÜPER ARABA VE ŞEHİR YÜKLENİYOR...' : 'LOADING SUPERCAR & SUNSET CITY...');

// ── SETUP WEBGL SCENE (SUNSET THEMED WORLD) ──────────────────────────────────
const container = document.getElementById('c');
const scene = new THREE.Scene();

// Sunset Orange Atmospheric Fog
scene.fog = new THREE.FogExp2(0xfc5c3c, 0.0055);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xfc5c3c, 1);

// Hide Loader
setTimeout(() => {
  const loader = document.getElementById('loader');
  loader.style.opacity = 0;
  setTimeout(() => loader.style.display = 'none', 500);
}, 800);

// ── LIGHTING SETUP (SUNSET GLOW & CONTRAST SHADOWS) ──────────────────────────
const ambientLight = new THREE.AmbientLight(0xff7c54, 0.75); // warm sunset ambient fill
scene.add(ambientLight);

// Sunlight / Moonlight casting high quality shadows
const dirLight = new THREE.DirectionalLight(0xffdfbd, 1.8); // warm sunlight
dirLight.position.set(60, 80, -20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 300;
const d = 50;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
dirLight.shadow.bias = -0.0006;
scene.add(dirLight);

// Sky light
const hemiLight = new THREE.HemisphereLight(0xff6b4a, 0x1d121c, 0.5);
hemiLight.position.set(0, 100, 0);
scene.add(hemiLight);

// Atmospheric Giant Sunset Sun! (Adds stunning aesthetic visual depth)
const sunGeo = new THREE.SphereGeometry(24, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffe082 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.position.set(500, 32, -180); // Placed far in the horizon
scene.add(sunMesh);


// ── SCENE MATERIALS ──────────────────────────────────────────────────────────
const roadMaterial = new THREE.MeshStandardMaterial({
  color: 0x1b181d, // Dark warm asphalt grey
  roughness: 0.75,
  metalness: 0.15
});

const sidewalkMaterial = new THREE.MeshStandardMaterial({
  color: 0x3d3540,
  roughness: 0.8,
  metalness: 0.1
});

const guardrailMaterial = new THREE.MeshStandardMaterial({
  color: 0x7c6982,
  roughness: 0.4,
  metalness: 0.8
});

// Procedurally generated high-performance window textures (reduces draw calls from 3000+ to under 100!)
const buildingMaterials = [];
const colorThemes = [
  ['#ffca28', '#ffc107', '#ffe082'], // Golden yellow
  ['#00e5ff', '#00b0ff', '#80deea'], // Cyber cyan/blue
  ['#ff5722', '#ff7043', '#ffab91'], // Neon orange/red
  ['#e040fb', '#d500f9', '#ea80fc'], // Purple/pink
  ['#00e676', '#00c853', '#b9f6ca']  // Emerald green
];

const buildingBaseColors = [
  0x1b1424, // deep indigo
  0x2a101f, // dark plum
  0x110d14, // dark graphite
  0x30151e, // burgundy
  0x141829  // dark blue
];

for (let i = 0; i < 5; i++) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  // Base facade background
  ctx.fillStyle = '#110d15';
  ctx.fillRect(0, 0, 128, 256);
  
  // Draw window grid pattern
  const cols = 4;
  const rows = 12;
  const winW = 16;
  const winH = 10;
  const padX = 12;
  const padY = 8;
  
  ctx.shadowBlur = 6;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const isLit = Math.random() > 0.45;
      if (isLit) {
        const theme = colorThemes[i];
        ctx.fillStyle = theme[Math.floor(Math.random() * theme.length)];
        ctx.shadowColor = ctx.fillStyle;
      } else {
        ctx.fillStyle = '#050306';
        ctx.shadowColor = 'transparent';
      }
      ctx.fillRect(padX + c * (winW + padX), padY + r * (winH + padY), winW, winH);
    }
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  
  const mat = new THREE.MeshStandardMaterial({
    color: buildingBaseColors[i],
    map: texture,
    emissive: 0xffffff,
    emissiveMap: texture,
    emissiveIntensity: 1.1,
    roughness: 0.4,
    metalness: 0.5
  });
  
  buildingMaterials.push(mat);
}

const winLitCyan = new THREE.MeshBasicMaterial({ color: 0x00e5ff });

const carBodyMat = new THREE.MeshStandardMaterial({
  color: 0xd50000, // Rich racing red
  roughness: 0.12,
  metalness: 0.95,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1
});

const carbonMat = new THREE.MeshStandardMaterial({
  color: 0x1a161c,
  roughness: 0.5,
  metalness: 0.8
});

const tireMat = new THREE.MeshStandardMaterial({
  color: 0x0f0d11,
  roughness: 0.9,
  metalness: 0.1
});

const alloyMat = new THREE.MeshStandardMaterial({
  color: 0xe0e0e0,
  roughness: 0.25,

// Helper for TR license plate
function createLicensePlateTexture(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 32;
  const ctx = canvas.getContext('2d');
  
  // Plate base white
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 128, 32);
  
  // Blue TR band
  ctx.fillStyle = '#002fbe';
  ctx.fillRect(0, 0, 16, 32);
  
  // TR text
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TR', 8, 22);
  
  // Black border
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, 128, 32);
  
  // License Plate Text
  ctx.fillStyle = '#000000';
  ctx.font = '900 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, 72, 22);
  
  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

// 2. STABLE TWO-TIER RIGGED WHEELS (Z-ROLLING INSIDE Y-STEERING) WITH ULTRA-REALISTIC DETAILING
const wheels = [];
const wheelSpinGroups = [];
const wfbOffset = carLength * 0.32;
const wlrOffset = carWidth * 0.48; // Sit on the sides!

const wheelOffsets = [
  { x: wfbOffset, z: wlrOffset },   // Front Right
  { x: wfbOffset, z: -wlrOffset },  // Front Left
  { x: -wfbOffset, z: wlrOffset },  // Rear Right
  { x: -wfbOffset, z: -wlrOffset }  // Rear Left
];

const tireRadius = 0.42;
const tireWidth = 0.38;

// Cylinders are oriented along the Y axis by default, rotate it on X to orient sideways (along Z)
const wheelGeom = new THREE.CylinderGeometry(tireRadius, tireRadius, tireWidth, 24);
wheelGeom.rotateX(Math.PI / 2);

wheelOffsets.forEach((off, i) => {
  const wParent = new THREE.Group();
  wParent.position.set(off.x, 0.42, off.z);
  
  // Secondary nested wheel spin group for Z-axis roll spin rotation
  const spinGroup = new THREE.Group();
  wParent.add(spinGroup);
  wheelSpinGroups.push(spinGroup);
  
  // 1. Tire Rubber
  const tire = new THREE.Mesh(wheelGeom, tireMat);
  tire.castShadow = true;
  tire.receiveShadow = true;
  spinGroup.add(tire);
  
  // Create beautiful customized rims depending on the model!
  const rimGroup = new THREE.Group();
  
  if (carId === "rust_bucket") {
    // 124 Classic steel wheels with baby moon chrome center caps + white walls
    const discGeo = new THREE.CylinderGeometry(tireRadius * 0.88, tireRadius * 0.88, tireWidth + 0.01, 16);
    discGeo.rotateX(Math.PI / 2);
    const disc = new THREE.Mesh(discGeo, carbonMat); // Black steel wheel base
    rimGroup.add(disc);
    
    // White wall rings on outer sides (towards positive Z for right, negative Z for left)
    const sideSign = (off.z > 0) ? 1 : -1;
    const wwGeo = new THREE.RingGeometry(tireRadius * 0.65, tireRadius * 0.85, 16);
    const wwMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const whiteWall = new THREE.Mesh(wwGeo, wwMat);
    whiteWall.position.z = sideSign * (tireWidth / 2 + 0.012);
    rimGroup.add(whiteWall);
    
    // Baby Moon central chrome hubcap
    const capGeo = new THREE.SphereGeometry(tireRadius * 0.42, 12, 12);
    capGeo.scale(1, 1, 0.35); // flatten sphere
    const cap = new THREE.Mesh(capGeo, chromeMat);
    cap.position.z = sideSign * (tireWidth / 2 + 0.015);
    cap.rotation.x = Math.PI/2;
    rimGroup.add(cap);
    
  } else if (carId === "tofas_sahin") {
    // CMS 40 Classic Turkish Tuner Rims: Five big wide spokes with high metallic contrast
    const sideSign = (off.z > 0) ? 1 : -1;
    
    // Deep-dish barrel
    const barrelGeo = new THREE.CylinderGeometry(tireRadius * 0.8, tireRadius * 0.82, tireWidth * 0.8, 16);
    barrelGeo.rotateX(Math.PI / 2);
    const barrel = new THREE.Mesh(barrelGeo, chromeMat);
    rimGroup.add(barrel);
    
    // Star-spoke face
    const spokeFace = new THREE.Group();
    spokeFace.position.z = sideSign * (tireWidth/2 - 0.01);
    
    const centerHubGeo = new THREE.CylinderGeometry(tireRadius * 0.26, tireRadius * 0.26, 0.04, 8);
    centerHubGeo.rotateX(Math.PI/2);
    const centerHub = new THREE.Mesh(centerHubGeo, alloyMat);
    spokeFace.add(centerHub);
    
    // 5 wide CMS 40-style block spokes
    for (let s = 0; s < 5; s++) {
      const spokeGeo = new THREE.BoxGeometry(0.08, tireRadius * 1.38, 0.02);
      const spoke = new THREE.Mesh(spokeGeo, alloyMat);
      spoke.rotation.z = (s * Math.PI * 2) / 5;
      spokeFace.add(spoke);
      
      const darkInfillGeo = new THREE.BoxGeometry(0.05, tireRadius * 1.15, 0.01);
      const darkInfill = new THREE.Mesh(darkInfillGeo, carbonMat);
      darkInfill.rotation.z = (s * Math.PI * 2) / 5;
      darkInfill.position.z = sideSign * 0.005;
      spokeFace.add(darkInfill);
    }
    rimGroup.add(spokeFace);
    
    // Brake Caliper visible behind (Only front wheels Y-steering / rear static)
    const caliperGeo = new THREE.BoxGeometry(0.12, 0.22, 0.12);
    const caliper = new THREE.Mesh(caliperGeo, redCalipersMat);
    caliper.position.set(-tireRadius * 0.45, tireRadius * 0.25, -sideSign * 0.06);

// Generates single-mesh buildings using the 5 shared canvas textures (reduces draw calls from 3,000+ to under 100!)
function createProceduralBuilding(x, z, w, d, h, matIndex) {
  const group = new THREE.Group();
  group.position.set(x, h/2, z);
  
  // Concrete chassis with the procedurally mapped window texture
  const shellGeo = new THREE.BoxGeometry(w, h, d);
  const shell = new THREE.Mesh(shellGeo, buildingMaterials[matIndex]);
  shell.castShadow = true;
  shell.receiveShadow = true;
  group.add(shell);
  
  // Cool roof architectures
  if (h > 40) {
    const penthouseGeo = new THREE.BoxGeometry(w * 0.75, 2.0, d * 0.75);
    const penthouse = new THREE.Mesh(penthouseGeo, carbonMat);
    penthouse.position.y = h/2 + 1.0;
    group.add(penthouse);
    
    // Antenna
    const poleGeo = new THREE.CylinderGeometry(0.08, 0.1, 8, 6);
    const antenna = new THREE.Mesh(poleGeo, alloyMat);
    antenna.position.set(0, h/2 + 6, 0);
    group.add(antenna);
    
    // Glowing warning beacon
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff1744 }));
    beacon.position.set(0, h/2 + 10, 0);
    group.add(beacon);
  }
  
  // Side glowing vertical neon billboard strip (Aesthetic cyberpunk look)
  if (Math.random() > 0.6) {
    const neonCol = Math.random() > 0.5 ? 0x00e5ff : 0xff6b4a;
    const neonLineGeo = new THREE.BoxGeometry(0.3, h * 0.8, 0.3);
    const neonLine = new THREE.Mesh(neonLineGeo, new THREE.MeshBasicMaterial({ color: neonCol }));
    // Place on the road-facing edge
    const edgeOffsetZ = (z > 0) ? -d/2 - 0.2 : d/2 + 0.2;
    neonLine.position.set(-w/2 + 1.0, 0, edgeOffsetZ);
    group.add(neonLine);
  }
  
  scene.add(group);
  return group;
}

// ── PARTICLES SYSTEM (EXHAUST SMOKE & DRIFT SMOKE) ───────────────────────────
const maxParticles = 90;
const particleGeometry = new THREE.BufferGeometry();
const particlePositions = new Float32Array(maxParticles * 3);
const particleSizes = new Float32Array(maxParticles);
const particleAlphas = new Float32Array(maxParticles);

for (let i = 0; i < maxParticles; i++) {
  particlePositions[i*3] = 0;
  particlePositions[i*3+1] = -999;
  particlePositions[i*3+2] = 0;
  particleSizes[i] = 1.0;
  particleAlphas[i] = 0.0;
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
particleGeometry.setAttribute('alpha', new THREE.BufferAttribute(particleAlphas, 1));

const pVertexShader = `
  attribute float size;
  attribute float alpha;
  varying float vAlpha;
  void main() {
    vAlpha = alpha;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (320.0 / -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const pFragmentShader = `
  varying float vAlpha;
  void main() {
    vec2 p = gl_PointCoord - vec2(0.5);
    float d = length(p);
    if (d > 0.5) discard;
    float intensity = 1.0 - (d / 0.5);
    gl_FragColor = vec4(0.9, 0.85, 0.8, vAlpha * intensity * 0.5); // Sunset tinted dust smoke
  }
`;

const particleMaterial = new THREE.ShaderMaterial({
  vertexShader: pVertexShader,
  fragmentShader: pFragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particleSystem);

const smokePool = [];
for (let i = 0; i < maxParticles; i++) {
  smokePool.push({
    x: 0, y: -999, z: 0,
    vx: 0, vy: 0, vz: 0,
    size: 0,
    alpha: 0,
    life: 0,
    maxLife: 0,
    idx: i
  });
}

let activeSmokeIdx = 0;
function spawnSmoke(x, y, z, size, scaleX, scaleZ, isBlackExhaust) {
  const p = smokePool[activeSmokeIdx];
  p.x = x;
  p.y = y;
  p.z = z;
  p.vx = (Math.random() - 0.5) * scaleX;
  p.vy = 0.4 + Math.random() * 0.8;
  p.vz = (Math.random() - 0.5) * scaleZ;
  p.size = size * (1.1 + Math.random() * 0.7);
  p.alpha = 0.8;
  p.life = 0;
  p.maxLife = 0.5 + Math.random() * 0.5;
  
  activeSmokeIdx = (activeSmokeIdx + 1) % maxParticles;
}


// ── SKIDMARKS GENERATOR (DRIFT ROAD IMPRESSIONS) ────────────────────────────
const skidMaterial = new THREE.MeshBasicMaterial({
  color: 0x050406,
  transparent: true,
  opacity: 0.75,
  side: THREE.DoubleSide,
  depthWrite: false
});

const skidSegments = [];
const maxSkidSegments = 180;

function addSkidSegment(posL, posR, prevPosL, prevPosR) {
  const geom = new THREE.BufferGeometry();
  
  const vertices = new Float32Array([
    prevPosL.x, 0.03, prevPosL.z,
    posL.x,     0.03, posL.z,
    posR.x,     0.03, posR.z,
    
    prevPosL.x, 0.03, prevPosL.z,
    posR.x,     0.03, posR.z,
    prevPosR.x, 0.03, prevPosR.z
  ]);
  
  geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  const mesh = new THREE.Mesh(geom, skidMaterial);
  scene.add(mesh);
  
  skidSegments.push({ mesh: mesh, created: Date.now() });
  
  if (skidSegments.length > maxSkidSegments) {
    const oldest = skidSegments.shift();
    scene.remove(oldest.mesh);
    oldest.mesh.geometry.dispose();
  }
}

const keys = { left: false, right: false, gas: false, brake: false };

function bindControl(id, actionKey) {
  const el = document.getElementById(id);
  if (!el) return;
  
  el.addEventListener('touchstart', e => {

    triggerSoundActivation();
    keys[actionKey] = true;

  el.addEventListener('touchend', e => {

  el.addEventListener('mousedown', () => { triggerSoundActivation(); keys[actionKey] = true; });
  el.addEventListener('mouseup', () => { keys[actionKey] = false; });
  el.addEventListener('mouseleave', () => { keys[actionKey] = false; });
}

// ── PHYSICS & HANDLING CONFIGURATION ─────────────────────────────────────────
let carX = 0, carZ = 0;
let carAngle = 0;
let velocityX = 0, velocityZ = 0;
let currentSpeed = 0;
let wheelSpin = 0;
let distanceTraveled = 0;

// Dynamic Specs
let MAX_SPEED = 2.40;
let ACCEL = 0.045;
let STEER_FORCE = 0.048;
let DRIFT_SLIP = 0.32; // Slip factor for responsive drifting slaloms
const DECCEL = 0.015;

if (carId === "rust_bucket") {
  MAX_SPEED = 1.35; ACCEL = 0.024; STEER_FORCE = 0.038; DRIFT_SLIP = 0.22;
} else if (carId === "tofas_sahin") {
  MAX_SPEED = 1.85; ACCEL = 0.038; STEER_FORCE = 0.052; DRIFT_SLIP = 0.38; // Ultra slide drift machine
} else if (carId === "bmw_m3") {
  MAX_SPEED = 2.65; ACCEL = 0.052; STEER_FORCE = 0.050; DRIFT_SLIP = 0.30;
} else if (carId === "tesla_model_s") {
  MAX_SPEED = 3.20; ACCEL = 0.075; STEER_FORCE = 0.044; DRIFT_SLIP = 0.16; // Extreme acceleration, low slip
} else if (carId === "ferrari") {
  MAX_SPEED = 3.65; ACCEL = 0.088; STEER_FORCE = 0.054; DRIFT_SLIP = 0.34; // Super sports setup
}

// Active body tilting values
let targetLeanRoll = 0;
let currentLeanRoll = 0;
let targetLeanPitch = 0;
let currentLeanPitch = 0;

let prevSkidLeft = null;
let prevSkidRight = null;

let isCurrentlyDrifting = false;
let driftScore = 0;
let driftMultiplier = 1.0;
let driftBonusShowTimer = 0;

let lastSpawnX = -100;


// ── CORE TICK LOOPS ──────────────────────────────────────────────────────────
let lastTime = 0;

function updatePhysics(dt) {
  const fpsScale = dt * 60;
  
  // 1. FORWARD / REVERSE SPEED MATHS
  if (keys.gas) {
    currentSpeed = Math.min(currentSpeed + ACCEL * fpsScale, MAX_SPEED);
  } else if (keys.brake) {
    currentSpeed = Math.max(currentSpeed - DECCEL * 2.8 * fpsScale, -MAX_SPEED * 0.25);
  } else {
    currentSpeed = Math.max(currentSpeed - DECCEL * fpsScale, 0);
  }
  
  // 2. STEERING MATRIX & HEADING
  let steerAngle = 0;
  if (keys.left) steerAngle = STEER_FORCE;
  if (keys.right) steerAngle = -STEER_FORCE;
  
  // Turn front wheels visually inside their sockets (Y-steering)
  wheels[0].rotation.y = steerAngle * 4.5;
  wheels[1].rotation.y = steerAngle * 4.5;
  
  if (Math.abs(currentSpeed) > 0.08) {
    const scaleSteer = currentSpeed / MAX_SPEED;
    carAngle += steerAngle * scaleSteer * fpsScale;
  }
  
  // 3. DRIFT DRIFT PHYSICS DEVIATION (Centrifugal Inertia)
  const forwardX = Math.cos(carAngle);
  const forwardZ = Math.sin(carAngle);
  
  const targetVelX = forwardX * currentSpeed;
  const targetVelZ = forwardZ * currentSpeed;
  
  // Slip triggers: sharp turn at speed, or locking rear brakes
  const isBrakingHard = keys.brake && currentSpeed > 0.4;
  const isTurningSharp = (keys.left || keys.right) && currentSpeed > MAX_SPEED * 0.35;
  
  let currentSlip = 0.08; // solid traction
  if (isBrakingHard || isTurningSharp) {
    currentSlip = DRIFT_SLIP;
  }
  
  // Apply linear interpolation of current velocity to drift vectors
  velocityX += (targetVelX - velocityX) * (1.0 - currentSlip) * fpsScale;
  velocityZ += (targetVelZ - velocityZ) * (1.0 - currentSlip) * fpsScale;
  
  const speedMag = Math.sqrt(velocityX*velocityX + velocityZ*velocityZ);
  
  // Apply positions with bounds guard clamping
  carX += velocityX * fpsScale;
  carZ += velocityZ * fpsScale;
  
  if (carZ > LANE_LIMIT) {
    carZ = LANE_LIMIT;
    velocityZ *= -0.25; // bounce slightly
  } else if (carZ < -LANE_LIMIT) {
    carZ = -LANE_LIMIT;
    velocityZ *= -0.25;
  }
  
  distanceTraveled += speedMag * fpsScale;
  wheelSpin += speedMag * 0.35 * fpsScale;
  
  // Spin nested wheel groups on the Z-axis for clean rolling rotation
  wheelSpinGroups.forEach(w => w.rotation.z = wheelSpin);
  
  // 4. SUSPENSION TILT LEANS (ACTIVE VECHICLE ROLE/PITCH EFFECT)
  // Steer left -> roll body right
  targetLeanRoll = steerAngle * speedMag * 0.12;
  // Accel -> pitch back; Brake -> nose dive pitch forward
  targetLeanPitch = (keys.gas ? -0.06 : 0) + (keys.brake ? 0.12 : 0);
  
  currentLeanRoll += (targetLeanRoll - currentLeanRoll) * 0.15 * fpsScale;
  currentLeanPitch += (targetLeanPitch - currentLeanPitch) * 0.15 * fpsScale;
  
  carVisualGroup.rotation.z = currentLeanRoll;
  carVisualGroup.rotation.x = currentLeanPitch;
  
  // 5. DRIFT TRACKING AND REWARDS
  const hVec = new THREE.Vector2(forwardX, forwardZ).normalize();
  const tVec = new THREE.Vector2(velocityX, velocityZ);
  const tLen = tVec.length();
  
  let angleDifference = 0;
  if (tLen > 0.15) {
    tVec.normalize();
    angleDifference = Math.acos(Math.max(-1, Math.min(1, hVec.dot(tVec))));
  }
  
  // If sliding sideways beyond 12 degrees and moving fast
  if (angleDifference > 0.2 && tLen > 0.45) {
    isCurrentlyDrifting = true;
    
    const scoreAdd = Math.round(angleDifference * 12 * tLen * fpsScale);
    driftScore += scoreAdd;
    driftMultiplier = Math.min(5.0, driftMultiplier + 0.015 * fpsScale);
    driftBonusShowTimer = 1.0;
    
    // Tire skidmark geometry footprints (from back tires)
    const rearX = carX - forwardX * (carLength * 0.32);
    const rearZ = carZ - forwardZ * (carLength * 0.32);
    const perpX = -forwardZ * (carWidth * 0.45);
    const perpZ = forwardX * (carWidth * 0.45);
    
    const skidPosL = new THREE.Vector3(rearX + perpX, 0.02, rearZ + perpZ);
    const skidPosR = new THREE.Vector3(rearX - perpX, 0.02, rearZ - perpZ);
    
    if (prevSkidLeft && prevSkidRight) {
      addSkidSegment(skidPosL, skidPosR, prevSkidLeft, prevSkidRight);
    }
    prevSkidLeft = skidPosL;
    prevSkidRight = skidPosR;
    
    // Spawn drift tire smoke puffs
    if (Math.random() > 0.3) {
      spawnSmoke(rearX + perpX, 0.15, rearZ + perpZ, 2.2, 1.5, 1.5, false);
      spawnSmoke(rearX - perpX, 0.15, rearZ - perpZ, 2.2, 1.5, 1.5, false);
    }
  } else {
    isCurrentlyDrifting = false;
    prevSkidLeft = null;
    prevSkidRight = null;
    
    driftMultiplier = Math.max(1.0, driftMultiplier - 0.03 * fpsScale);
    if (driftBonusShowTimer > 0) {
      driftBonusShowTimer -= dt;
    }
  }
  
  // Active faint exhaust idle/acceleration smoke particles
  const pipeX = carX - forwardX * (carLength * 0.52);
  const pipeZ = carZ - forwardZ * (carLength * 0.52);
  const rightPipeZ = pipeZ + forwardX * (carWidth * 0.25) - forwardZ * (carWidth * 0.25);
  if (Math.random() > (keys.gas ? 0.3 : 0.8)) {
    spawnSmoke(pipeX, 0.48, rightPipeZ, keys.gas ? 1.4 : 0.8, 0.4, 0.4, true);
  }
  
  // ── 6. INFINITE CHUNKING / RUNTIME MATHEMATICAL RECYCLING (O(1) Stateless Modulo) ──
  // Keep the main roads, sidewalks, guardrails and sun centered on the car
  roadMesh.position.x = carX;
  sidewalkL.position.x = carX;
  sidewalkR.position.x = carX;
  railL.position.x = carX;
  railR.position.x = carX;
  sunMesh.position.x = carX + 500;

  // Recycle road stripes O(1) (40 stripes spaced by 12 = 480 total length)
  for (let i = 0; i < stripes.length; i++) {
    const stripe = stripes[i];
    const nextX = Math.floor((carX - stripe.initialX + 240) / 480) * 480 + stripe.initialX;
    stripe.meshL.position.x = nextX;
    stripe.meshR.position.x = nextX;
    stripe.meshCL.position.x = nextX;
    stripe.meshCR.position.x = nextX;
  }

  // Recycle streetlights O(1) (8 lights on each side spaced by 35 = 280 total length)
  for (let i = 0; i < streetLights.length; i++) {
    const light = streetLights[i];
    const nextX = Math.floor((carX - light.initialX + 140) / 280) * 280 + light.initialX;
    light.group.position.x = nextX;
  }

  // Recycle buildings O(1) (18 buildings on each side spaced by 20 = 360 total length)
  for (let i = 0; i < buildings.length; i++) {
    const building = buildings[i];
    const nextX = Math.floor((carX - building.initialX + 180) / 360) * 360 + building.initialX;
    building.mesh.position.x = nextX;
  }
  
  // Recenter lighting shadow to track vehicle position
  dirLight.position.set(carX + 60, 80, carZ - 20);
  dirLight.target = carGroup;
  
  // Update sound synthesizer state
  const speedRatio = speedMag / MAX_SPEED;
  carSound.update(speedRatio, keys.gas, keys.brake, isCurrentlyDrifting);
}

function updateParticles(dt) {
  const positions = particleGeometry.attributes.position.array;
  const sizes = particleGeometry.attributes.size.array;
  const alphas = particleGeometry.attributes.alpha.array;
  
  for (let i = 0; i < maxParticles; i++) {
    const p = smokePool[i];
    if (p.alpha > 0) {
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.alpha = 0;
        positions[i*3+1] = -999; // hide
      } else {
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        
        p.size += dt * 5.0; // grow over time
        p.alpha = 1.0 - (p.life / p.maxLife);
        
        positions[i*3] = p.x;
        positions[i*3+1] = p.y;
        positions[i*3+2] = p.z;
      }
    }
    sizes[i] = p.size;
    alphas[i] = p.alpha;
  }
  
  particleGeometry.attributes.position.needsUpdate = true;
  particleGeometry.attributes.size.needsUpdate = true;
  particleGeometry.attributes.alpha.needsUpdate = true;
}


// ── MAIN RAF LOOP ────────────────────────────────────────────────────────────
function animate(timestamp) {
  requestAnimationFrame(animate);
  
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // guard lag peaks
  lastTime = timestamp;
  
  updatePhysics(dt);
  updateParticles(dt);
  
  // Camera smooth follow matrix
  const targetCamX = carX - Math.cos(carAngle) * 9.2;
  const targetCamZ = carZ - Math.sin(carAngle) * 9.2;
  
  camera.position.x += (targetCamX - camera.position.x) * 0.12;
  camera.position.z += (targetCamZ - camera.position.z) * 0.12;
  camera.position.y = 4.0 + (currentSpeed * 0.35); // rises at high speeds
  
  camera.lookAt(carX + Math.cos(carAngle) * 2.5, 0.85, carZ + Math.sin(carAngle) * 2.5);
  
  // Set position and orientation of model group
  carGroup.position.set(carX, 0, carZ);
  carGroup.rotation.y = -carAngle;
  
  // Update HUD elements
  const displaySpeed = Math.round((Math.abs(currentSpeed) / MAX_SPEED) * 230);
  document.getElementById('spd').textContent = displaySpeed;
  document.getElementById('dist').textContent = Math.round(distanceTraveled);
  
  // Update drift score popups
  const toast = document.getElementById('drift-toast');
  if (driftBonusShowTimer > 0) {
    toast.classList.add('active');
    document.getElementById('drift-title').innerHTML = isCurrentlyDrifting ? `DRIFTING!` : `DRIFT BONUS!`;
    document.getElementById('drift-score').innerHTML = `+${driftScore} PTS <span style="color:#ffca28; font-weight:900;">x${driftMultiplier.toFixed(1)}</span>`;
  } else {
    toast.classList.remove('active');
    driftScore = 0;
  }
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Launch!
requestAnimationFrame(animate);

</script>
