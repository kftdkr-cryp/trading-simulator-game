<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Pro Drift Simülatörü</title>
<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#03050a;overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #c{display:block;width:100vw;height:100vh;}
  
  /* UI Layout */
  #ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
  
  /* Modern Pedals and Controls */
  #controls{position:fixed;bottom:24px;left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px;pointer-events:none;}
  .ctrl-group{display:flex;gap:16px;pointer-events:all;}
  
  /* Steering Buttons */
  .steer-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.75);
    border: 2px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
    transition: all 0.15s cubic-bezier(0.1, 0.8, 0.3, 1);
  }
  .steer-btn:active {
    background: rgba(0, 230, 118, 0.35);
    border-color: #00e676;
    transform: scale(0.9);
    box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
  }

  /* Sleek Metal Pedals */
  .pedal-container {
    display: flex;
    align-items: flex-end;
    gap: 20px;
  }
  .pedal {
    position: relative;
    border-radius: 12px;
    background: linear-gradient(135deg, #2c3540 0%, #11161d 100%);
    border: 3px solid #4a5568;
    box-shadow: 
      0 12px 24px rgba(0,0,0,0.5), 
      inset 0 4px 6px rgba(255,255,255,0.15),
      inset 0 -4px 10px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 12px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  /* Accelerator (Gas) - Tall and sleek */
  .pedal-gas {
    width: 60px;
    height: 120px;
    border-color: #2e7d32;
  }
  .pedal-gas::before {
    content: '';
    position: absolute;
    top: 15%; left: 15%; right: 15%; bottom: 15%;
    border-radius: 6px;
    background: repeating-linear-gradient(0deg, #151a21, #151a21 6px, #374151 6px, #374151 12px);
    border-top: 2px solid rgba(255,255,255,0.1);
  }
  .pedal-gas:active {
    transform: scaleY(0.92) scaleX(0.96) translateY(4px);
    border-color: #00e676;
    box-shadow: 0 0 20px rgba(0,230,118,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #1b3a24 0%, #0c1810 100%);
  }

  /* Brake - Wider and slightly shorter */
  .pedal-brake {
    width: 84px;
    height: 100px;
    border-color: #c62828;
  }
  .pedal-brake::before {
    content: '';
    position: absolute;
    top: 15%; left: 10%; right: 10%; bottom: 15%;
    border-radius: 6px;
    background: repeating-linear-gradient(90deg, #151a21, #151a21 8px, #4b5563 8px, #4b5563 16px);
    border-top: 2px solid rgba(255,255,255,0.1);
  }
  .pedal-brake:active {
    transform: scaleY(0.92) scaleX(0.96) translateY(4px);
    border-color: #ff5252;
    box-shadow: 0 0 20px rgba(255,82,82,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #421c1c 0%, #1f0d0d 100%);
  }

  .pedal-label {
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    font-family: monospace;
    z-index: 2;
  }
  .pedal-gas:active .pedal-label { color: #00e676; text-shadow: 0 0 8px rgba(0,230,118,0.6); }
  .pedal-brake:active .pedal-label { color: #ff5252; text-shadow: 0 0 8px rgba(255,82,82,0.6); }

  /* HUD Styling */
  #hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;pointer-events:none;}
  .hud-box{background:rgba(10,15,30,0.75);border:1.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:8px 16px;color:#fff;font-family:monospace;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.5);display:flex;align-items:baseline;gap:4px;}
  .hud-val{font-size:24px;font-weight:900;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.4);}
  .hud-unit{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;}

  /* Active Drift Score UI */
  #drift-toast {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-family: monospace;
    text-align: center;
    z-index: 5;
  }
  #drift-toast.active {
    opacity: 1;
    transform: translateX(-50%) scale(1.1);
  }
  .drift-title {
    color: #ffb300;
    font-size: 26px;
    font-weight: 900;
    text-shadow: 0 0 15px rgba(255, 179, 0, 0.8), 0 2px 4px rgba(0,0,0,0.5);
    letter-spacing: 2px;
    animation: driftPulse 0.4s infinite alternate;
  }
  .drift-score {
    color: #00e676;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0, 230, 118, 0.8);
    margin-top: 2px;
  }
  
  @keyframes driftPulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  /* Sleek Circular Close Button */
  #back-btn{
    position:fixed;
    top:16px;
    left:16px;
    background:rgba(15, 23, 42, 0.8);
    border:2.5px solid rgba(255,255,255,0.3);
    border-radius:50%;
    width:48px;
    height:48px;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    pointer-events:all;
    z-index:100;
    backdrop-filter:blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition:all 0.2s cubic-bezier(0.1, 0.8, 0.3, 1);
  }
  #back-btn:active{
    background:rgba(255,82,82,0.3);
    border-color:#ff5252;
    transform:scale(0.85);
    box-shadow: 0 0 15px rgba(255,82,82,0.4);
  }
  
  /* Top Right Info Label */
  #car-label{
    position:fixed;
    top:16px;
    right:16px;
    background:rgba(15, 23, 42, 0.8);
    border:1.5px solid rgba(255,193,7,0.4);
    border-radius:14px;
    padding:8px 14px;
    color:#FFC107;
    font-size:12px;
    font-weight:bold;
    font-family:monospace;
    pointer-events:none;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
  }

  /* Fallback loading view */
  #loader {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: #090d16;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 999;
    font-family: monospace;
    transition: opacity 0.5s ease;
  }
  .spinner {
    border: 4px solid rgba(255, 255, 255, 0.1);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border-left-color: #ffc107;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div id="load-text">SİMÜLASYON YÜKLENİYOR...</div>
</div>

<canvas id="c"></canvas>

<div id="ui">
  <button id="back-btn" onclick="history.back()">✕</button>
  <div id="car-label">🚗 MOD: YÜKLENİYOR...</div>
  
  <div id="hud">
    <div class="hud-box">🚗 <span class="hud-val" id="spd">0</span><span class="hud-unit">km/h</span></div>
    <div class="hud-box">🌆 <span class="hud-val" id="dist">0</span><span class="hud-unit">m</span></div>
  </div>

  <div id="drift-toast">
    <div class="drift-title" id="drift-title">DRIFTING!</div>
    <div class="drift-score" id="drift-score">+0 PTS</div>
  </div>

  <div id="controls">
    <!-- Directional Buttons (Left) -->
    <div class="ctrl-group">
      <div class="steer-btn" id="btn-left">◀</div>
      <div class="steer-btn" id="btn-right">▶</div>
    </div>
    
    <!-- Real-life styled metallic Pedals (Right) -->
    <div class="ctrl-group">
      <div class="pedal-container">
        <!-- Brake -->
        <div class="pedal pedal-brake" id="btn-brake">
          <span class="pedal-label">BRAKE</span>
        </div>
        <!-- Gas -->
        <div class="pedal pedal-gas" id="btn-gas">
          <span class="pedal-label">GAS</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Parse and decode hash strictly to prevent URL Encoding bugs like %F0...
const hashStr = decodeURIComponent(location.hash.slice(1));
const hash = hashStr.split(',');
const carId = hash[0] || 'car_standard';
const carColorHex = parseInt(hash[1] || '0x2255ff');
const carName = (hash[2] || 'Araba').replace(/_/g, ' ');
const lang = hash[3] || 'TR';

// Set label immediately
document.getElementById('car-label').textContent = (lang === 'TR' ? '🚗 SÜRÜŞ MODU: ' : '🚗 DRIVE MODE: ') + carName.toUpperCase();
document.getElementById('load-text').textContent = (lang === 'TR' ? 'DÜNYA VE 3D FİZİKLER YÜKLENİYOR...' : 'LOADING WORLD & 3D PHYSICS...');

// Safety fallback check if Three.js didn't load (extremely rare)
if (typeof THREE === 'undefined') {
  document.getElementById('load-text').innerHTML = "<span style='color:#ff5252'>Hata: İnternet veya Kütüphane yüklenemedi!</span><br><br><button onclick='location.reload()' style='padding:10px 20px; background:#fff; border:none; border-radius:5px; font-weight:bold;'>Yeniden Dene</button>";
}

// ── SETUP THREE.JS SCENE ───────────────────────────────────────────────────
const container = document.getElementById('c');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0f1d, 0.007);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0a0f1d, 1);

// Hide Loader
setTimeout(() => {
  const loader = document.getElementById('loader');
  loader.style.opacity = 0;
  setTimeout(() => loader.style.display = 'none', 500);
}, 800);

// ── ATMOSPHERIC LIGHTS (PRO LIGHTING DECORATION) ───────────────────────────
const ambientLight = new THREE.AmbientLight(0x223355, 0.6); // rich slate blue fill light
scene.add(ambientLight);

// Sunlight / Moonlight casting high quality shadows
const dirLight = new THREE.DirectionalLight(0x4466aa, 1.4);
dirLight.position.set(40, 100, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 300;
const d = 50;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

// Skybox representation
const hemiLight = new THREE.HemisphereLight(0x4466aa, 0x050811, 0.4);
hemiLight.position.set(0, 50, 0);
scene.add(hemiLight);

// ── MATERIALS ─────────────────────────────────────────────────────────────
const roadMaterial = new THREE.MeshStandardMaterial({
  color: 0x111622,
  roughness: 0.85,
  metalness: 0.1
});

const sidewalkMaterial = new THREE.MeshStandardMaterial({
  color: 0x333b4d,
  roughness: 0.7,
  metalness: 0.15
});

const buildingMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x1a233a, roughness: 0.6, metalness: 0.4 }),
  new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.5, metalness: 0.5 }),
  new THREE.MeshStandardMaterial({ color: 0x241d3b, roughness: 0.6, metalness: 0.3 }),
  new THREE.MeshStandardMaterial({ color: 0x152c22, roughness: 0.7, metalness: 0.2 }),
  new THREE.MeshStandardMaterial({ color: 0x2b221a, roughness: 0.6, metalness: 0.4 })
];

const emissiveWindowMaterial = new THREE.MeshBasicMaterial({
  color: 0xffd54f
});

const darkWindowMaterial = new THREE.MeshBasicMaterial({
  color: 0x05070c
});

// Convert color hex
function hexToColor(hex) {
  const r = (hex >> 16 & 0xff) / 255;
  const g = (hex >> 8 & 0xff) / 255;
  const b = (hex & 0xff) / 255;
  return new THREE.Color(r, g, b);
}
const carColorObj = hexToColor(carColorHex || 0x2255ff);

// Paint Materials
const carBodyMat = new THREE.MeshStandardMaterial({
  color: carColorObj,
  roughness: 0.18,
  metalness: 0.9,
  flatShading: false
});

const carCarbonMat = new THREE.MeshStandardMaterial({
  color: 0x151a22,
  roughness: 0.4,
  metalness: 0.8
});

const carWheelMat = new THREE.MeshStandardMaterial({
  color: 0x0a0c10,
  roughness: 0.9,
  metalness: 0.1
});

const chromeMat = new THREE.MeshStandardMaterial({
  color: 0xdde2eb,
  roughness: 0.05,
  metalness: 1.0
});

const neonMat = new THREE.MeshBasicMaterial({
  color: 0x00e676
});

const taillightMat = new THREE.MeshBasicMaterial({
  color: 0xff1744
});

const headlightMat = new THREE.MeshBasicMaterial({
  color: 0xffffff
});

// ── WORLD COORDINATES & TRACK LAYOUT ─────────────────────────────────────────
const ROAD_WIDTH = 18;
const LANE_LIMIT = 6.8;
const buildings = [];
const streetLights = [];
const stripes = [];

// ── BUILD PROCEDURAL CAR MODEL ──────────────────────────────────────────────
const carGroup = new THREE.Group();
scene.add(carGroup);

// Base specs
let carLength = 4.2;
let carHeight = 0.85;
let carWidth = 2.0;
let cabinLength = 2.2;
let cabinHeight = 0.65;
let cabinWidth = 1.75;
let cabinOffset = 0.2;
let spoilerType = "none";
let neonColorHex = 0x00ff88;

if (carId === "rust_bucket") {
  carLength = 3.6; carHeight = 0.9; carWidth = 1.7;
  cabinLength = 1.8; cabinHeight = 0.7; cabinWidth = 1.4;
  cabinOffset = 0.1;
  spoilerType = "none";
  carBodyMat.color.setHex(0x8d5c4c); // rusty brown overrides
  carBodyMat.roughness = 0.8;
  carBodyMat.metalness = 0.3;
} else if (carId === "tofas_sahin") {
  carLength = 4.3; carHeight = 0.95; carWidth = 1.8;
  cabinLength = 2.2; cabinHeight = 0.7; cabinWidth = 1.5;
  cabinOffset = 0.15;
  spoilerType = "small";
} else if (carId === "bmw_m3") {
  carLength = 4.6; carHeight = 0.8; carWidth = 1.95;
  cabinLength = 2.4; cabinHeight = 0.62; cabinWidth = 1.65;
  cabinOffset = 0.25;
  spoilerType = "sport";
} else if (carId === "tesla_model_s") {
  carLength = 4.8; carHeight = 0.78; carWidth = 2.05;
  cabinLength = 2.6; cabinHeight = 0.58; cabinWidth = 1.75;
  cabinOffset = 0.35;
  spoilerType = "lip";
} else if (carId === "ferrari") {
  carLength = 4.7; carHeight = 0.65; carWidth = 2.15;
  cabinLength = 2.0; cabinHeight = 0.48; cabinWidth = 1.8;
  cabinOffset = -0.15;
  spoilerType = "f40_wing";
}

// 1. CAR BODY MESHES
const bodyGeom = new THREE.BoxGeometry(carLength, carHeight, carWidth);
const bodyMesh = new THREE.Mesh(bodyGeom, carBodyMat);
bodyMesh.position.y = 0.5 + carHeight/2;
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
carGroup.add(bodyMesh);

// 2. CABIN (GLASS / FRAMES)
const cabinGeom = new THREE.BoxGeometry(cabinLength, cabinHeight, cabinWidth);
const cabinMesh = new THREE.Mesh(cabinGeom, carCarbonMat);
cabinMesh.position.set(cabinOffset, 0.5 + carHeight + cabinHeight/2 - 0.05, 0);
cabinMesh.castShadow = true;
carGroup.add(cabinMesh);

// Windshield glass highlights
const glassGeom = new THREE.BoxGeometry(0.1, cabinHeight * 0.9, cabinWidth * 0.95);
const windshield = new THREE.Mesh(glassGeom, new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.01, metalness: 0.95, transparent: true, opacity: 0.8 }));
windshield.position.set(cabinOffset + cabinLength/2 + 0.02, 0.5 + carHeight + cabinHeight/2 - 0.05, 0);
carGroup.add(windshield);

// 3. WHEELS
const wheelGeom = new THREE.CylinderGeometry(0.38, 0.38, 0.4, 16);
wheelGeom.rotateX(Math.PI / 2);
const hubGeom = new THREE.CylinderGeometry(0.2, 0.2, 0.42, 12);
hubGeom.rotateX(Math.PI / 2);

const wheels = [];
const wfbOffset = carLength * 0.33;
const wlrOffset = carWidth * 0.45;

const wheelOffsets = [
  { x: wfbOffset, z: wlrOffset },   // Front Right
  { x: wfbOffset, z: -wlrOffset },  // Front Left
  { x: -wfbOffset, z: wlrOffset },  // Rear Right
  { x: -wfbOffset, z: -wlrOffset }  // Rear Left
];

wheelOffsets.forEach((off, i) => {
  const wParent = new THREE.Group();
  wParent.position.set(off.x, 0.38, off.z);
  
  const tire = new THREE.Mesh(wheelGeom, carWheelMat);
  tire.castShadow = true;
  wParent.add(tire);
  
  const hub = new THREE.Mesh(hubGeom, chromeMat);
  wParent.add(hub);
  
  carGroup.add(wParent);
  wheels.push(wParent);
});

// 4. HEADLIGHTS (LED style glow cubes)
const headlightGeom = new THREE.BoxGeometry(0.15, 0.18, 0.32);
const hlR = new THREE.Mesh(headlightGeom, headlightMat);
hlR.position.set(carLength/2, 0.5 + carHeight * 0.6, carWidth * 0.38);
const hlL = hlR.clone();
hlL.position.z = -carWidth * 0.38;
carGroup.add(hlR);
carGroup.add(hlL);

// Headlight Active Spotlights (Casts real white beam cone forward!)
const spotLightR = new THREE.SpotLight(0xffffff, 2.5, 45, Math.PI/4, 0.5, 1);
spotLightR.position.set(carLength/2, 0.5 + carHeight*0.6, carWidth*0.38);
spotLightR.castShadow = true;
spotLightR.shadow.bias = -0.001;
const targetObjR = new THREE.Object3D();
targetObjR.position.set(carLength/2 + 20, 0.2, carWidth*0.38);
carGroup.add(targetObjR);
spotLightR.target = targetObjR;
carGroup.add(spotLightR);

const spotLightL = spotLightR.clone();
spotLightL.position.z = -carWidth*0.38;
const targetObjL = new THREE.Object3D();
targetObjL.position.set(carLength/2 + 20, 0.2, -carWidth*0.38);
carGroup.add(targetObjL);
spotLightL.target = targetObjL;
carGroup.add(spotLightL);

// 5. TAILLIGHTS (Neon red tubes)
const taillightGeom = new THREE.BoxGeometry(0.1, 0.12, 0.38);
const tlR = new THREE.Mesh(taillightGeom, taillightMat);
tlR.position.set(-carLength/2, 0.5 + carHeight * 0.6, carWidth * 0.36);
const tlL = tlR.clone();
tlL.position.z = -carWidth * 0.36;
carGroup.add(tlR);
carGroup.add(tlL);

// 6. SPOILER DESIGNS (High-quality asset details)
if (spoilerType !== "none") {
  const spoilerGroup = new THREE.Group();
  spoilerGroup.position.set(-carLength/2 + 0.3, 0.5 + carHeight, 0);
  
  if (spoilerType === "lip") {
    const lipGeo = new THREE.BoxGeometry(0.3, 0.08, carWidth * 0.85);
    const lip = new THREE.Mesh(lipGeo, carCarbonMat);
    lip.position.y = 0.04;
    spoilerGroup.add(lip);
  } else if (spoilerType === "small" || spoilerType === "sport") {
    const wingGeo = new THREE.BoxGeometry(0.25, 0.05, carWidth * 0.95);
    const wing = new THREE.Mesh(wingGeo, carBodyMat);
    wing.position.y = 0.25;
    
    const postGeo = new THREE.BoxGeometry(0.1, 0.25, 0.1);
    const postR = new THREE.Mesh(postGeo, carCarbonMat);
    postR.position.set(-0.05, 0.12, carWidth * 0.35);
    const postL = postR.clone();
    postL.position.z = -carWidth * 0.35;
    
    spoilerGroup.add(wing);
    spoilerGroup.add(postR);
    spoilerGroup.add(postL);
  } else if (spoilerType === "f40_wing") {
    // Aggressive side wing panels integrated with the rear bodywork
    const wingGeo = new THREE.BoxGeometry(0.4, 0.08, carWidth);
    const wing = new THREE.Mesh(wingGeo, carBodyMat);
    wing.position.y = 0.4;
    
    const panelGeo = new THREE.BoxGeometry(0.5, 0.42, 0.06);
    const panelR = new THREE.Mesh(panelGeo, carBodyMat);
    panelR.position.set(0, 0.21, carWidth/2 - 0.03);
    const panelL = panelR.clone();
    panelL.position.z = -carWidth/2 + 0.03;
    
    spoilerGroup.add(wing);
    spoilerGroup.add(panelR);
    spoilerGroup.add(panelL);
  }
  carGroup.add(spoilerGroup);
}

  // 3. Volumetric glowing windows rows
  const windowRows = Math.floor(h / 3.5);
  const windowCols = Math.floor(w / 3.0);
  
  const windowWidth = 1.0;
  const windowHeight = 1.6;
  const windowDepth = d + 0.05; // protrude slightly for rendering
  
  const winGeo = new THREE.BoxGeometry(windowWidth, windowHeight, windowDepth);
  
  for (let r = 0; r < windowRows; r++) {

// Special custom shader for gorgeous round smoke puff particles
const pVertexShader = `
  attribute float size;
  attribute float alpha;
  varying float vAlpha;
  void main() {
    vAlpha = alpha;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (300.0 / -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const pFragmentShader = `
  varying float vAlpha;
  void main() {
    // Generate circular shape procedural gradient
    vec2 p = gl_PointCoord - vec2(0.5);
    float d = length(p);
    if (d > 0.5) discard;
    float intensity = 1.0 - (d / 0.5);
    gl_FragColor = vec4(0.85, 0.85, 0.9, vAlpha * intensity * 0.45);
  }
`;

const particleMaterial = new THREE.ShaderMaterial({

  fragmentShader: pFragmentShader,

// ── DRIFT TIRES SKID MARKS MAKER (DYNAMIC 3D SKID MESHES) ───────────────────
const skidMaterial = new THREE.MeshBasicMaterial({
  color: 0x010103,
  transparent: true,
  opacity: 0.65,
  side: THREE.DoubleSide,
  depthWrite: false
});

const skidSegments = [];
const maxSkidSegments = 160;

function addSkidMarkSegment(posL, posR, prevPosL, prevPosR) {
  // Build a custom quad between previous wheel edge and current wheel edge
  const geom = new THREE.BufferGeometry();
  
  const vertices = new Float32Array([
    prevPosL.x, 0.025, prevPosL.z,
    posL.x,     0.025, posL.z,
    posR.x,     0.025, posR.z,
    
    prevPosL.x, 0.025, prevPosL.z,
    posR.x,     0.025, posR.z,
    prevPosR.x, 0.025, prevPosR.z
  ]);
  
  geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  const mesh = new THREE.Mesh(geom, skidMaterial);
  scene.add(mesh);
  
  skidSegments.push({ mesh: mesh, created: Date.now() });
  
  // Keep size within bounds to keep memory extremely clean
  if (skidSegments.length > maxSkidSegments) {
    const oldest = skidSegments.shift();
    scene.remove(oldest.mesh);
    oldest.mesh.geometry.dispose();
  }
}

// ── DRIFT PHYSICS SIMULATOR (ADVANCED CAR HANDLING) ─────────────────────────
let carX = 0, carZ = 0;
let carAngle = 0;
let velocityX = 0, velocityZ = 0;
let currentSpeed = 0;
let wheelSpin = 0;
let distanceTraveled = 0;

// Dynamic Specs
let MAX_SPEED = 1.35;
let ACCEL = 0.024;
let STEER_FORCE = 0.046;
let DRIFT_SLIP = 0.28; // how slippery the tires are when drifting
const DECCEL = 0.015;

if (carId === "rust_bucket") {
  MAX_SPEED = 0.95; ACCEL = 0.014; STEER_FORCE = 0.038; DRIFT_SLIP = 0.22;
} else if (carId === "tofas_sahin") {
  MAX_SPEED = 1.45; ACCEL = 0.025; STEER_FORCE = 0.048; DRIFT_SLIP = 0.36; // very high slip - drift machine
} else if (carId === "bmw_m3") {
  MAX_SPEED = 1.95; ACCEL = 0.035; STEER_FORCE = 0.052; DRIFT_SLIP = 0.30;
} else if (carId === "tesla_model_s") {
  MAX_SPEED = 2.45; ACCEL = 0.050; STEER_FORCE = 0.045; DRIFT_SLIP = 0.18; // heavy grip, low slip
} else if (carId === "ferrari") {
  MAX_SPEED = 3.10; ACCEL = 0.068; STEER_FORCE = 0.056; DRIFT_SLIP = 0.32; // supercar speed and slip
}

// Skid points tracking
let prevSkidLeft = null;
let prevSkidRight = null;

// Arcade Drift Score Variables
let isCurrentlyDrifting = false;
let driftScore = 0;
let driftMultiplier = 1.0;
let driftBonusShowTimer = 0;


// ── CHUNK & STRETCH PROCEDURAL RUNTIME BUILDER ──────────────────────────────
let lastSpawnX = -100;


// ── CORE GAME LOOP (REPRESENTATION & RENDER) ─────────────────────────────────
let lastTime = 0;

function updatePhysics(dt) {
  // Convert dt to ideal speed scale (60fps baseline)
  const fpsScale = dt * 60;
  
  // 1. ENGINE ACCELERATION & BRAKES
  if (keys.gas) {
    currentSpeed = Math.min(currentSpeed + ACCEL * fpsScale, MAX_SPEED);
  } else if (keys.brake) {
    currentSpeed = Math.max(currentSpeed - DECCEL * 2.5 * fpsScale, -MAX_SPEED * 0.25);
  } else {
    currentSpeed = Math.max(currentSpeed - DECCEL * fpsScale, 0);
  }
  
  // 2. STEERING MECHANICS & ROTATIONS
  let steerAngle = 0;
  if (keys.left) steerAngle = STEER_FORCE;
  if (keys.right) steerAngle = -STEER_FORCE;
  
  // Front wheel visual turning feedback
  wheels[0].rotation.y = steerAngle * 6.5;
  wheels[1].rotation.y = steerAngle * 6.5;
  
  // Apply steering to heading (only if moving)
  if (Math.abs(currentSpeed) > 0.08) {
    // Steer less at extreme high speed for control, or more if sliding
    const steerFactor = currentSpeed / MAX_SPEED;
    carAngle += steerAngle * steerFactor * fpsScale;
  }
  
  // 3. DRIFT & INERTIA VECTOR CALCULATIONS (The drift secret sauce)
  const forwardX = Math.cos(carAngle);
  const forwardZ = Math.sin(carAngle);
  
  // Target velocity along facing direction
  const targetVelX = forwardX * currentSpeed;
  const targetVelZ = forwardZ * currentSpeed;
  
  // Check drift slip triggers: sharp steer at medium-to-high speeds or heavy braking
  const isBrakingHard = keys.brake && currentSpeed > 0.4;
  const isTurningSharp = (keys.left || keys.right) && currentSpeed > MAX_SPEED * 0.45;
  
  let currentSlip = 0.08; // high traction standard grip
  if (isBrakingHard || isTurningSharp) {
    currentSlip = DRIFT_SLIP; // tires lose grip!
  }
  
  // Interpolate actual velocity with slip factor
  velocityX += (targetVelX - velocityX) * (1.0 - currentSlip) * fpsScale;
  velocityZ += (targetVelZ - velocityZ) * (1.0 - currentSlip) * fpsScale;
  
  // Speed magnitude
  const actualSpeedMag = Math.sqrt(velocityX*velocityX + velocityZ*velocityZ);
  
  // 4. APPLY POSITION UPDATES WITH LANE CLAMPING
  carX += velocityX * fpsScale;
  carZ += velocityZ * fpsScale;
  
  // Smoothly clamp within road lanes
  if (carZ > LANE_LIMIT) {
    carZ = LANE_LIMIT;
    velocityZ *= -0.2; // slight bounce off wall/curb
  } else if (carZ < -LANE_LIMIT) {
    carZ = -LANE_LIMIT;
    velocityZ *= -0.2;
  }
  
  distanceTraveled += actualSpeedMag * fpsScale;
  wheelSpin += actualSpeedMag * 0.4 * fpsScale;
  
  // Rotate all wheels
  wheels.forEach(w => {
    w.rotation.x = wheelSpin;
  });
  
  // 5. DRIFT TRACKING AND REWARDS
  const headingVec = new THREE.Vector2(forwardX, forwardZ).normalize();
  const travelVec = new THREE.Vector2(velocityX, velocityZ);
  const travelLen = travelVec.length();
  
  let angleDifference = 0;
  if (travelLen > 0.15) {
    travelVec.normalize();
    // Dot product gives angle
    const dot = headingVec.dot(travelVec);
    angleDifference = Math.acos(Math.max(-1, Math.min(1, dot)));
  }
  
  // If sliding sideways significantly, trigger DRIFT!
  const slideThreshold = 0.18; // approx 10 degrees slide
  if (angleDifference > slideThreshold && travelLen > 0.4) {
    isCurrentlyDrifting = true;
    
    // Increment drift score
    const driftGain = Math.round(angleDifference * 10 * travelLen * fpsScale);
    driftScore += driftGain;
    driftMultiplier = Math.min(5.0, driftMultiplier + 0.01 * fpsScale);
    driftBonusShowTimer = 1.0; // keep showing drift toast
    
    // Trigger visual tire skid marks on road (from back tires)
    const rearX = carX - forwardX * (carLength*0.3);
    const rearZ = carZ - forwardZ * (carLength*0.3);
    
    const perpX = -forwardZ * (carWidth * 0.45);
    const perpZ = forwardX * (carWidth * 0.45);
    
    const skidPosL = new THREE.Vector3(rearX + perpX, 0.02, rearZ + perpZ);
    const skidPosR = new THREE.Vector3(rearX - perpX, 0.02, rearZ - perpZ);
    
    if (prevSkidLeft && prevSkidRight) {
      addSkidMarkSegment(skidPosL, skidPosR, prevSkidLeft, prevSkidRight);
    }
    
    prevSkidLeft = skidPosL;
    prevSkidRight = skidPosR;
    
    // Spawn gorgeous drift tyre smoke particles!
    if (Math.random() > 0.4) {
      spawnSmokeParticle(rearX + perpX, 0.2, rearZ + perpZ, 2.0);
      spawnSmokeParticle(rearX - perpX, 0.2, rearZ - perpZ, 2.0);
    }
  } else {
    isCurrentlyDrifting = false;
    prevSkidLeft = null;
    prevSkidRight = null;
    
    // Multiplier decays if not drifting
    driftMultiplier = Math.max(1.0, driftMultiplier - 0.04 * fpsScale);
    if (driftBonusShowTimer > 0) {
      driftBonusShowTimer -= dt;
    }
  }
  
  // 6. DETAILED WORLD CHUNKING & RECYCLING (Spawns endless streetscape)
  if (carX - lastSpawnX > 60) {
    spawnBuildingsChunk(carX + 400);
    lastSpawnX = carX;
    
    // Add road stripes ahead dynamically
    const nextStripeX = stripes[stripes.length - 1].x + 12;
    // Reposition the oldest stripe to the far front to save memory completely!
    const oldestStripe = stripes.shift();
    oldestStripe.x = nextStripeX;
    oldestStripe.meshL.position.x = nextStripeX;
    oldestStripe.meshR.position.x = nextStripeX;
    oldestStripe.meshCL.position.x = nextStripeX;
    oldestStripe.meshCR.position.x = nextStripeX;
    stripes.push(oldestStripe);
    
    // Also move streetlights ahead dynamically!
    const oldestLight = streetLights.shift();
    const nextLightX = streetLights[streetLights.length - 1].x + 35;
    oldestLight.x = nextLightX;
    oldestLight.group.position.x = nextLightX;
    streetLights.push(oldestLight);
  }
  
  // Recenter light shadow frustum to follow car
  dirLight.position.set(carX + 40, 100, carZ + 20);
  dirLight.target = carGroup;
}

// Update particle buffer geometry positions each frame
function updateParticles(dt) {
  const positions = particleGeometry.attributes.position.array;
  const sizes = particleGeometry.attributes.size.array;
  const alphas = particleGeometry.attributes.alpha.array;
  
  for (let i = 0; i < maxParticles; i++) {
    const p = smokePool[i];
    if (p.alpha > 0) {
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.alpha = 0;
        positions[i*3+1] = -999; // hide
      } else {
        // Apply physics to particles
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        
        // expand smoke
        p.size += dt * 4.0;
        p.alpha = 1.0 - (p.life / p.maxLife);
        
        positions[i*3] = p.x;
        positions[i*3+1] = p.y;
        positions[i*3+2] = p.z;
      }
    }
    sizes[i] = p.size;
    alphas[i] = p.alpha;
  }
  
  particleGeometry.attributes.position.needsUpdate = true;
  particleGeometry.attributes.size.needsUpdate = true;
  particleGeometry.attributes.alpha.needsUpdate = true;
}

// ── RENDER ENGINE FRAME FUNCTION ─────────────────────────────────────────────
function animate(timestamp) {
  requestAnimationFrame(animate);
  
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // clamp lag spikes
  lastTime = timestamp;
  
  // Run Physics updates
  updatePhysics(dt);
  updateParticles(dt);
  
  // Smooth Camera chase logic
  const targetCamX = carX - Math.cos(carAngle) * 9.5;
  const targetCamZ = carZ - Math.sin(carAngle) * 9.5;
  
  camera.position.x += (targetCamX - camera.position.x) * 0.12;
  camera.position.z += (targetCamZ - camera.position.z) * 0.12;
  // Camera height rises slightly with high speeds for professional racing effect
  camera.position.y = 4.2 + (Math.abs(currentSpeed) * 0.45);
  
  // Point camera target at the hood center of car
  camera.lookAt(carX + Math.cos(carAngle) * 2.5, 0.9, carZ + Math.sin(carAngle) * 2.5);
  
  // Update Car Group Position & Yaw
  carGroup.position.set(carX, 0, carZ);
  carGroup.rotation.y = -carAngle;
  
  // UPDATE HUD LABELS
  const displaySpeed = Math.round((Math.abs(currentSpeed) / MAX_SPEED) * 210);
  document.getElementById('spd').textContent = displaySpeed;
  document.getElementById('dist').textContent = Math.round(distanceTraveled);
  
  // UPDATE DRIFT SCORE DISPLAY
  const driftToast = document.getElementById('drift-toast');
  if (driftBonusShowTimer > 0) {
    driftToast.classList.add('active');
    document.getElementById('drift-title').innerHTML = isCurrentlyDrifting ? `DRIFTING!` : `DRIFT BONUS!`;
    document.getElementById('drift-score').innerHTML = `+${driftScore} PTS <span style="color:#ffc107; font-weight:900;">x${driftMultiplier.toFixed(1)}</span>`;
  } else {
    driftToast.classList.remove('active');
    // Save points once complete
    driftScore = 0;
  }
  
  // Run WebGL draw call
  renderer.render(scene, camera);
}

// Window Responsive Redraw Support
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start loop
requestAnimationFrame(animate);

</script>
</body>
</html>
